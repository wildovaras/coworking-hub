<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago confirmado · Coworking Hub</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/logo.svg">
<style>
  body { background: var(--bg); display: grid; place-items: center; padding: var(--space-5); min-height: 100vh; }
  .success-card {
    background: var(--card); border-radius: var(--radius-lg); padding: var(--space-7);
    max-width: 460px; width: 100%;
    border: 1px solid var(--border);
  }
  .check-mark {
    width: 40px; height: 40px;
    color: var(--success);
    margin-bottom: var(--space-4);
    animation: fadeUp 400ms ease backwards;
  }
  .check-mark svg { width: 100%; height: 100%; stroke-width: 2; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1 {
    font-size: 24px; margin-bottom: 6px; color: var(--ink);
    letter-spacing: -0.5px; font-weight: 500;
  }
  .subtitle { color: var(--text-muted); margin-bottom: var(--space-5); font-size: 14px; }
  .detail-box {
    border-top: 1px solid var(--border-soft);
    margin-bottom: var(--space-5);
  }
  .detail-row {
    display: flex; justify-content: space-between;
    padding: var(--space-3) 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border-soft);
  }
  .detail-row span:first-child { color: var(--text-muted); }
  .detail-row span:last-child {
    color: var(--ink); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .actions { display: flex; }
  .footnote {
    margin-top: var(--space-4);
    font-size: 12px; color: var(--text-light);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="success-card">
    <div class="check-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Pago confirmado</h1>
    <p class="subtitle">Tu acceso al centro está activo.</p>

    <div class="detail-box" id="detalles">
      <div class="detail-row"><span>Cargando…</span><span></span></div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary">Volver al panel</a>
    </div>
    <p class="footnote">Recibirás el comprobante en el correo asociado.</p>
  </div>

<script>
const params = new URLSearchParams(location.search);
const sid = params.get('session_id');
const fmtCLP = n => '$' + (n || 0).toLocaleString('es-CL');

if (sid) {
  fetch('/api/checkout/session?id=' + sid)
    .then(r => r.json())
    .then(d => {
      const c = (d.currency || 'clp').toUpperCase();
      const monto = d.currency === 'clp' ? fmtCLP(d.amount) : (d.amount/100).toFixed(2) + ' ' + c;
      document.getElementById('detalles').innerHTML = `
        <div class="detail-row"><span>Producto</span><span>${d.producto || '—'}</span></div>
        <div class="detail-row"><span>Email</span><span>${d.email || '—'}</span></div>
        <div class="detail-row"><span>Monto</span><span>${monto}</span></div>
        <div class="detail-row"><span>Stripe</span><span>${d.status === 'paid' ? 'Pagado' : d.status}</span></div>
        <div class="detail-row"><span>Estado interno</span><span>${d.estadoBD === 'paid' ? 'Confirmado' : 'Procesando…'}</span></div>
      `;
    })
    .catch(err => {
      document.getElementById('detalles').innerHTML = '<div class="detail-row"><span>Error</span><span>' + err.message + '</span></div>';
    });
} else {
  document.getElementById('detalles').innerHTML = '<div class="detail-row"><span>Sin información de sesión</span><span></span></div>';
}
</script>
</body>
</html>
