<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago cancelado · Coworking Hub</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/logo.svg">
<style>
  body { background: var(--bg); display: grid; place-items: center; padding: 24px; min-height: 100vh; }
  .cancel-card {
    background: var(--card); backdrop-filter: blur(8px);
    border-radius: var(--radius-lg); padding: 48px;
    max-width: 460px; width: 100%;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
  }
  .x-mark {
    width: 40px; height: 40px;
    color: var(--text-muted);
    margin-bottom: var(--space-4);
  }
  .x-mark svg { width: 100%; height: 100%; stroke-width: 2; }
  h1 {
    font-size: 24px; margin-bottom: 6px; color: var(--ink);
    letter-spacing: -0.5px; font-weight: 500;
  }
  .subtitle { color: var(--text-muted); margin-bottom: var(--space-5); font-size: 14px; }
  .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="cancel-card">
    <div class="x-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <h1>Pago cancelado</h1>
    <p class="subtitle">No se realizó ningún cargo. Puedes intentarlo de nuevo cuando quieras.</p>
    <div class="actions">
      <a href="/" class="btn">Volver al inicio</a>
      <a href="/#membresias" class="btn btn-primary">Ver planes</a>
    </div>
  </div>
</body>
</html>
