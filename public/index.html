<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coworking Hub · Las Condes</title>
<meta name="description" content="Sistema de gestión integrado del coworking hub en Las Condes. Reserva, operación y admin en una sola app.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/components.css">
<link rel="icon" href="/logo.svg">
<style>
  /* Shell: topbar + iframe que ocupa el resto */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  .shell-topbar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    background: rgba(11,15,23,0.95);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }

  /* Brand a la izquierda */
  .brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .brand-logo {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--brand-500), var(--info));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #001620; font-size: 13px;
    flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
  .brand-text b { font-size: 13px; font-weight: 700; }
  .brand-text small { font-size: 10px; color: var(--text-3); }

  /* Botones de navegación */
  .nav-btns {
    display: flex; gap: 4px;
    margin-left: 12px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .nav-btns::-webkit-scrollbar { display: none; }
  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 38px;
    padding: 0 14px;
    border-radius: var(--r-2);
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: var(--fw-medium);
    cursor: pointer;
    white-space: nowrap;
    transition: all var(--t-fast) var(--ease);
    text-decoration: none;
  }
  .nav-btn:hover {
    background: var(--bg-1);
    color: var(--text-1);
  }
  .nav-btn[aria-current="page"] {
    background: var(--brand-soft);
    color: var(--brand-500);
    border-color: color-mix(in srgb, var(--brand-500) 30%, transparent);
  }
  .nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* Status + atajos a la derecha */
  .shell-right {
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .shell-status {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 10px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    font-size: 11px;
    color: var(--text-2);
  }
  .shell-status .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-3);
    display: inline-block;
  }
  .shell-status[data-ok="true"]  .live-dot { background: var(--ok); }
  .shell-status[data-ok="false"] .live-dot { background: var(--err); }
  .shell-open {
    width: 36px; height: 36px;
    border: 1px solid var(--line); background: var(--bg-1);
    border-radius: var(--r-2);
    color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none;
    transition: all var(--t-fast) var(--ease);
  }
  .shell-open:hover { color: var(--text-1); background: var(--bg-2); }

  /* Iframe */
  .shell-frame {
    flex: 1;
    width: 100%;
    border: none;
    background: var(--bg-0);
  }

  /* Mobile: brand sólo logo, botones más densos */
  @media (max-width: 720px) {
    .brand-text { display: none; }
    .nav-btn { padding: 0 10px; font-size: 12px; }
    .nav-btn span { display: none; }   /* solo iconos en mobile */
    .shell-status { display: none; }
  }
</style>
</head>
<body>

<header class="shell-topbar">
  <a href="#hub" class="brand" data-view="hub">
    <div class="brand-logo">CH</div>
    <div class="brand-text">
      <b>Coworking Hub</b>
      <small>Las Condes · Santiago</small>
    </div>
  </a>

  <nav class="nav-btns" id="nav">
    <button class="nav-btn" data-view="hub" aria-current="page" title="Inicio (1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </button>
    <button class="nav-btn" data-view="reservar" title="Reservar (2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Reservar</span>
    </button>
    <button class="nav-btn" data-view="staff" title="Operación staff (3)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Operación</span>
    </button>
    <button class="nav-btn" data-view="admin" title="Admin / KPIs (4)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><polyline points="7 14 11 10 15 14 21 8"/></svg>
      <span>Admin</span>
    </button>
    <button class="nav-btn" data-view="sistema" title="Design system (5)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
      <span>Sistema</span>
    </button>
    <button class="nav-btn" data-view="legacy" title="Panel legacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>
      <span>Legacy</span>
    </button>
  </nav>

  <div class="shell-right">
    <div class="shell-status" id="status" data-ok="true">
      <span class="live-dot"></span>
      <span id="statusText">…</span>
    </div>
    <a href="#" id="openTab" class="shell-open" title="Abrir esta vista en pestaña nueva" aria-label="Abrir en pestaña nueva">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </div>
</header>

<iframe class="shell-frame" id="frame" src="/hub.html" name="content" title="Contenido de Coworking Hub"></iframe>

<script>
  // ── Mapeo vista → URL embebida + título de pestaña
  const VIEWS = {
    hub:      { src: '/hub.html',           title: 'Inicio · Coworking Hub' },
    reservar: { src: '/app-reservar.html',  title: 'Reservar · Coworking Hub' },
    staff:    { src: '/staff-live.html',    title: 'Operación · Coworking Hub' },
    admin:    { src: '/admin.html',         title: 'Admin · Coworking Hub' },
    sistema:  { src: '/style-preview.html', title: 'Sistema · Coworking Hub' },
    legacy:   { src: '/legacy.html',        title: 'Legacy · Coworking Hub' }
  };

  const $  = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const frame = $('#frame');

  function setView(name, { push = true } = {}) {
    const view = VIEWS[name];
    if (!view) return;
    frame.src = view.src;
    document.title = view.title;
    $$('.nav-btn').forEach(b => {
      b.setAttribute('aria-current', b.dataset.view === name ? 'page' : 'false');
    });
    $('#openTab').href = view.src;
    if (push && location.hash.slice(1) !== name) {
      history.pushState({ view: name }, '', '#' + name);
    }
  }

  // ── Bind clicks en botones de nav
  $$('[data-view]').forEach(el => el.addEventListener('click', e => {
    e.preventDefault();
    setView(el.dataset.view);
  }));

  // ── Atajos de teclado 1-6
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    const map = { '1':'hub', '2':'reservar', '3':'staff', '4':'admin', '5':'sistema', '6':'legacy' };
    if (map[e.key]) { e.preventDefault(); setView(map[e.key]); }
  });

  // ── Hash routing: permite compartir links a vistas específicas (ej. /#admin)
  window.addEventListener('popstate', () => {
    const name = location.hash.slice(1) || 'hub';
    if (VIEWS[name]) setView(name, { push: false });
  });

  // Vista inicial desde hash o default
  const initial = location.hash.slice(1) || 'hub';
  setView(VIEWS[initial] ? initial : 'hub', { push: false });

  // ── Status del sistema (pinguea cada 60s)
  async function checkStatus() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      const d = await r.json();
      const ok = d.bootState?.dbReachable && d.bootState?.mlReady;
      $('#status').setAttribute('data-ok', String(ok));
      $('#statusText').textContent = ok ? 'Operativo' : (d.bootState?.dbReachable ? 'Cargando modelos' : 'BD caída');
    } catch {
      $('#status').setAttribute('data-ok', 'false');
      $('#statusText').textContent = 'Sin conexión';
    }
  }
  checkStatus();
  setInterval(checkStatus, 60_000);

  // ── Permite que el iframe pida cambio de vista (ej. desde el hub.html cuando hagas click en una card)
  window.addEventListener('message', e => {
    if (e.data?.type === 'navigate' && VIEWS[e.data.view]) {
      setView(e.data.view);
    }
  });
</script>
</body>
</html>
